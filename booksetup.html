<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Builder | Quirki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,400;0,600;1,400&family=DM+Sans:wght=300;400;500;600&family=DM+Mono:wght=400;500&family=Lora:ital,wght=0,400;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0f1011;
  --bg2:       #151618;
  --bg3:       #1c1e20;
  --bg4:       #232527;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.12);
  --text:      #d8dde3;
  --muted:     #5a6370;
  --muted2:    #3a404a;
  --accent:    #00e5c4;
  --accent-d:  #00b89e;
  --accent-g:  rgba(0,229,196,0.08);
  --accent-g2: rgba(0,229,196,0.15);
  --red:       #e05555;
  --serif:     'Playfair Display', Georgia, serif;
  --sans:      'DM Sans', sans-serif;
  --mono:      'DM Mono', monospace;
  --reading:   'Lora', Georgia, serif;
}
body.light {
  --bg:        #f2efe6;
  --bg2:       #ebe8df;
  --bg3:       #ffffff;
  --bg4:       #f7f5ef;
  --border:    rgba(0,0,0,0.08);
  --border2:   rgba(0,0,0,0.15);
  --text:      #1c1b18;
  --muted:     #706e64;
  --muted2:    #c8c5bc;
  --accent:    #8b1a1a;
  --accent-d:  #6b1414;
  --accent-g:  rgba(139,26,26,0.06);
  --accent-g2: rgba(139,26,26,0.12);
  --red:       #c0392b;
}

*{box-sizing:border-box;margin:0;padding:0;}
body {
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:0.9rem;
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
  transition:background 0.25s,color 0.25s;
}

.nav{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.nav-left,.nav-right{display:flex;align-items:center;gap:12px;}
.logo{
  font-family:var(--serif);font-size:1.3rem;font-weight:600;
  font-style:italic;color:var(--accent);text-decoration:none;
  display:flex;align-items:center;gap:7px;
}
.nav-back{color:var(--muted);display:flex;align-items:center;text-decoration:none;}
.nav-back:hover{color:var(--accent);}
.nav-btn{
  background:none;border:none;cursor:pointer;color:var(--muted);
  display:flex;align-items:center;padding:5px;border-radius:5px;
}
.nav-btn:hover{color:var(--accent);background:var(--accent-g);}
.nav-avatar{
  width:30px;height:30px;border-radius:4px;background:var(--accent-g);
  border:1.5px solid var(--accent-g2);display:flex;align-items:center;
  justify-content:center;color:var(--accent);font-size:0.8rem;font-weight:600;text-decoration:none;
}

.workspace{
  display:grid;
  grid-template-columns:260px 1fr 300px;
  flex:1;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.sidebar-label{font-family:var(--mono);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.15em;color:var(--muted);}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:4px;display:flex;align-items:center;}
.icon-btn:hover{color:var(--accent);background:var(--accent-g);}
.chapter-list{flex:1;overflow-y:auto;padding:8px;}
.chapter-item{
  display:flex;align-items:center;padding:9px 10px;border-radius:5px;cursor:pointer;
  gap:8px;margin-bottom:2px;border:1px solid transparent;transition:all 0.15s;
}
.chapter-item:hover{background:var(--bg3);}
.chapter-item.active{background:var(--accent-g);border-color:rgba(0,229,196,0.2);}
body.light .chapter-item.active{border-color:rgba(139,26,26,0.2);}
.chapter-num{font-family:var(--mono);font-size:0.7rem;color:var(--accent);min-width:20px;}
.chapter-name{font-size:0.85rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.chapter-item .del-btn{
  opacity:0;background:none;border:none;cursor:pointer;color:var(--red);
  padding:2px;display:flex;align-items:center;
}
.chapter-item:hover .del-btn{opacity:1;}

/* EDITOR PANE */
.editor-pane{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.editor-toolbar{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg2);}
.toolbar-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:4px;font-size:0.78rem;cursor:pointer;}
.toolbar-btn:hover{border-color:var(--border2);color:var(--text);}
.toolbar-sep{width:1px;height:18px;background:var(--border);margin:0 4px;}
.chapter-title-input{
  width:100%;padding:20px 32px 12px;font-family:var(--serif);font-size:1.6rem;
  color:var(--text);background:transparent;border:none;outline:none;border-bottom:1px solid var(--border);
}
.prose-editor{flex:1;overflow-y:auto;padding:24px 32px 60px;}
[contenteditable]{min-height:100%;font-family:var(--reading);font-size:16px;line-height:1.85;color:var(--text);outline:none;}
[contenteditable]:empty::before{content:attr(data-placeholder);color:var(--muted2);pointer-events:none;}
.word-count-bar{padding:6px 32px;border-top:1px solid var(--border);font-family:var(--mono);font-size:0.68rem;color:var(--muted);background:var(--bg2);}
.editor-empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);text-align:center;}
.editor-empty-state h3{font-family:var(--serif);font-size:1.4rem;font-style:italic;}

/* META PANEL */
.meta-panel{background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
.meta-section{padding:16px;border-bottom:1px solid var(--border);}
.meta-section-label{font-family:var(--mono);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.15em;color:var(--accent);margin-bottom:10px;display:block;}
.meta-input,.meta-textarea,.meta-select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:9px 11px;outline:none;font-family:var(--sans);font-size:0.85rem;}
.meta-input:focus,.meta-textarea:focus,.meta-select:focus{border-color:var(--accent);}
.meta-textarea{resize:none;min-height:90px;line-height:1.55;}
.tags-input-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:5px;cursor:text;}
.tag-pill{background:var(--accent-g2);color:var(--accent);font-family:var(--mono);font-size:0.7rem;padding:3px 8px;border-radius:3px;display:flex;align-items:center;gap:5px;}
.tag-pill button{background:none;border:none;cursor:pointer;color:var(--accent);font-size:0.75rem;}
.tags-raw-input{background:none;border:none;outline:none;color:var(--text);font-size:0.82rem;flex:1;min-width:80px;}
.tags-hint{font-family:var(--mono);font-size:0.65rem;color:var(--muted2);margin-top:5px;}

.cover-drop{border:1px dashed var(--border2);border-radius:5px;padding:20px;text-align:center;cursor:pointer;position:relative;}
.cover-drop img{width:100%;border-radius:4px;display:none;max-height:180px;object-fit:cover;}
.cover-placeholder{font-family:var(--mono);font-size:0.7rem;color:var(--muted);}
.cover-placeholder span{color:var(--accent);}
.cover-remove{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.7);border:none;color:#fff;border-radius:3px;padding:3px 6px;font-size:0.7rem;cursor:pointer;display:none;}
#coverInput{display:none;}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat-card{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:10px;text-align:center;}
.stat-value{font-family:var(--serif);font-size:1.3rem;color:var(--text);display:block;}
.stat-label{font-family:var(--mono);font-size:0.65rem;color:var(--muted);text-transform:uppercase;}
.action-section{padding:16px;display:flex;flex-direction:column;gap:8px;}
.btn-primary{width:100%;padding:12px;border:none;border-radius:5px;background:var(--accent);color:var(--bg);font-weight:600;cursor:pointer;}
.btn-primary:hover{background:var(--accent-d);}
.btn-secondary{width:100%;padding:11px;border-radius:5px;background:transparent;border:1px solid var(--border2);color:var(--text);cursor:pointer;}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg4);border:1px solid var(--border2);color:var(--text);padding:10px 20px;border-radius:6px;opacity:0;transition:all 0.2s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-left">
    <a href="quirki-writing.html" class="nav-back">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <span class="logo">quirki</span>
  </div>
  <div class="nav-right">
    <button class="nav-btn" onclick="toggleTheme()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <div class="nav-avatar">Z</div>
  </div>
</nav>

<div class="workspace">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-label">Chapters</span>
      <button class="icon-btn" onclick="addChapter()" title="New chapter">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="chapter-list" id="chapterList"></div>
  </aside>

  <main class="editor-pane">
    <div class="editor-empty-state" id="emptyState">
      <h3>No chapter active</h3>
      <p>Click the "+" icon on the sidebar to add a new chapter.</p>
    </div>
    
    <div id="activeEditor" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
      <div class="editor-toolbar">
        <button class="toolbar-btn" onclick="execCmd('bold')">B</button>
        <button class="toolbar-btn" onclick="execCmd('italic')">I</button>
        <button class="toolbar-btn" onclick="execCmd('underline')">U</button>
      </div>
      <input type="text" class="chapter-title-input" id="chapterTitleInput" placeholder="Chapter title…" oninput="onTitleChange()">
      <div class="prose-editor">
        <div id="proseEditor" contenteditable="true" data-placeholder="Start writing here…" oninput="onProseChange()"></div>
      </div>
      <div class="word-count-bar" id="wordCountBar">0 words</div>
    </div>
  </main>

  <aside class="meta-panel">
    <div class="meta-section">
      <span class="meta-section-label">Book Details</span>
      <input type="text" class="meta-input" id="metaTitle" placeholder="Book Title" oninput="saveData()">
      <input type="text" class="meta-input" style="margin-top:8px" id="metaAuthor" placeholder="Author Name" oninput="saveData()">
      <textarea class="meta-textarea" style="margin-top:8px" id="metaSynopsis" placeholder="Synopsis…" oninput="saveData()"></textarea>
    </div>

    <div class="meta-section">
      <span class="meta-section-label">Tags</span>
      <div class="tags-input-wrap" onclick="document.getElementById('tagRawInput').focus()">
        <span id="tagPillsContainer" style="display:inline-flex; flex-wrap:wrap; gap:5px;"></span>
        <input type="text" class="tags-raw-input" id="tagRawInput" placeholder="Add tag…" onkeydown="handleTagInput(event)">
      </div>
      <p class="tags-hint">Press Enter or comma to insert tag</p>
    </div>

    <div class="meta-section">
      <span class="meta-section-label">Cover</span>
      <div class="cover-drop" onclick="document.getElementById('coverInput').click()">
        <img id="coverPreview" src="" alt="">
        <div class="cover-placeholder" id="coverPlaceholder">Click to upload cover image</div>
        <button class="cover-remove" id="coverRemove" onclick="removeCover(event)">✕ Remove</button>
      </div>
      <input type="file" id="coverInput" accept="image/*" onchange="handleCoverUpload(event)">
    </div>

    <div class="meta-section">
      <span class="meta-section-label">Statistics</span>
      <div class="stats-grid">
        <div class="stat-card"><span class="stat-value" id="statChapters">0</span><span class="stat-label">Chapters</span></div>
        <div class="stat-card"><span class="stat-value" id="statWords">0</span><span class="stat-label">Words</span></div>
      </div>
    </div>

    <div class="action-section">
      <button class="btn-primary" onclick="showToast('Previewing book compilation...','success')">Preview Book</button>
      <button class="btn-secondary" onclick="saveAndExit()">Save & Exit</button>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
// Global runtime variables
let chapters = [];
let activeId = null;
let tags = [];

// Initialize Page Layout Safely
window.addEventListener('DOMContentLoaded', () => {
  // Load saved fallback data if it exists
  const saved = localStorage.getItem('quirki-local-book');
  if(saved) {
    try {
      const parsed = JSON.parse(saved);
      chapters = parsed.chapters || [];
      tags = parsed.tags || [];
      document.getElementById('metaTitle').value = parsed.title || '';
      document.getElementById('metaAuthor').value = parsed.author || '';
      document.getElementById('metaSynopsis').value = parsed.synopsis || '';
    } catch(e) {
      setupDefaultChapter();
    }
  } else {
    setupDefaultChapter();
  }

  renderChapters();
  renderTags();
  updateStats();
});

function setupDefaultChapter() {
  const id = 'ch-' + Math.random().toString(36).substring(2, 9);
  chapters = [{ id: id, title: 'Chapter One', content: '<p></p>' }];
  activeId = id;
  loadChapter(id);
}

function renderChapters() {
  const list = document.getElementById('chapterList');
  if(!list) return;
  list.innerHTML = '';

  chapters.forEach((ch, idx) => {
    const item = document.createElement('div');
    item.className = 'chapter-item' + (ch.id === activeId ? ' active' : '');
    item.innerHTML = `
      <span class="chapter-num">${String(idx+1).padStart(2,'0')}</span>
      <span class="chapter-name">${ch.title || 'Untitled Chapter'}</span>
      <button class="del-btn" onclick="deleteChapter('${ch.id}', event)">✕</button>
    `;
    item.addEventListener('click', () => loadChapter(ch.id));
    list.appendChild(item);
  });
}

function loadChapter(id) {
  saveCurrentContent();
  activeId = id;
  
  const ch = chapters.find(c => c.id === id);
  if(!ch) return;

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('activeEditor').style.display = 'flex';
  
  document.getElementById('chapterTitleInput').value = ch.title || '';
  document.getElementById('proseEditor').innerHTML = ch.content || '<p></p>';
  
  renderChapters();
  updateChapterWordCount();
}

function addChapter() {
  const id = 'ch-' + Math.random().toString(36).substring(2, 9);
  chapters.push({
    id: id,
    title: 'Chapter ' + (chapters.length + 1),
    content: '<p></p>'
  });
  loadChapter(id);
  saveData();
}

function deleteChapter(id, event) {
  event.stopPropagation();
  if(chapters.length <= 1) {
    showToast("You need to keep at least one chapter.", "error");
    return;
  }
  
  chapters = chapters.filter(c => c.id !== id);
  if(activeId === id) {
    activeId = chapters[0].id;
  }
  loadChapter(activeId);
  saveData();
}

function saveCurrentContent() {
  if(!activeId) return;
  const ch = chapters.find(c => c.id === activeId);
  if(ch) {
    ch.title = document.getElementById('chapterTitleInput').value;
    ch.content = document.getElementById('proseEditor').innerHTML;
  }
}

function onTitleChange() {
  const ch = chapters.find(c => c.id === activeId);
  if(ch) {
    ch.title = document.getElementById('chapterTitleInput').value;
    const activeItem = document.querySelector('.chapter-item.active .chapter-name');
    if(activeItem) activeItem.textContent = ch.title || 'Untitled Chapter';
  }
  saveData();
}

function onProseChange() {
  saveCurrentContent();
  updateChapterWordCount();
  updateStats();
  saveData();
}

function handleTagInput(e) {
  if(e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    let val = e.target.value.trim().replace(/,/g, '');
    if(val && !tags.includes(val)) {
      tags.push(val);
      renderTags();
      saveData();
    }
    e.target.value = '';
  }
}

function renderTags() {
  const container = document.getElementById('tagPillsContainer');
  if(!container) return;
  container.innerHTML = '';
  
  tags.forEach(t => {
    const pill = document.createElement('span');
    pill.className = 'tag-pill';
    pill.innerHTML = `#${t} <button onclick="removeTag('${t}')">✕</button>`;
    container.appendChild(pill);
  });
}

function removeTag(t) {
  tags = tags.filter(tag => tag !== t);
  renderTags();
  saveData();
}

function handleCoverUpload(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    document.getElementById('coverPreview').src = evt.target.result;
    document.getElementById('coverPreview').style.display = 'block';
    document.getElementById('coverRemove').style.display = 'block';
    document.getElementById('coverPlaceholder').style.display = 'none';
    saveData();
  };
  reader.readAsDataURL(file);
}

function removeCover(e) {
  e.stopPropagation();
  document.getElementById('coverPreview').src = '';
  document.getElementById('coverPreview').style.display = 'none';
  document.getElementById('coverRemove').style.display = 'none';
  document.getElementById('coverPlaceholder').style.display = 'block';
  document.getElementById('coverInput').value = '';
  saveData();
}

function updateChapterWordCount() {
  const txt = document.getElementById('proseEditor').innerText || '';
  const words = txt.trim() ? txt.trim().split(/\s+/).length : 0;
  document.getElementById('wordCountBar').textContent = `${words} words in this chapter`;
}

function updateStats() {
  document.getElementById('statChapters').textContent = chapters.length;
  let totalWords = 0;
  chapters.forEach(c => {
    const cleanText = (c.content || '').replace(/<[^>]*>/g, ' ').trim();
    if(cleanText) totalWords += cleanText.split(/\s+/).length;
  });
  document.getElementById('statWords').textContent = totalWords;
}

function saveData() {
  saveCurrentContent();
  const payload = {
    title: document.getElementById('metaTitle').value,
    author: document.getElementById('metaAuthor').value,
    synopsis: document.getElementById('metaSynopsis').value,
    chapters: chapters,
    tags: tags
  };
  localStorage.setItem('quirki-local-book', JSON.stringify(payload));
}

function saveAndExit() {
  saveData();
  window.location.href = 'quirki-writing.html';
}

function execCmd(cmd) {
  document.execCommand(cmd, false, null);
  document.getElementById('proseEditor').focus();
}

function toggleTheme() {
  document.body.classList.toggle('light');
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => { t.className = 'toast'; }, 2500);
}
</script>
</body>
</html>
