<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Quirki — Boards</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&family=Lora:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#1a1c1e;
  --bg-nav:#1c1e20;
  --bg-card:#212326;
  --bg-section:#1f2123;

  --teal:#00e5c4;
  --teal-dim:#00b89e;
  --teal-glow:rgba(0,229,196,0.08);

  --text:#d8dde3;
  --text-muted:#6a7480;

  --border:rgba(255,255,255,0.06);

  --serif:'Playfair Display', Georgia, serif;
  --sans:'DM Sans', sans-serif;
  --reading:'Lora', Georgia, serif;
}

body.light{
  --bg:#f7f4eb;
  --bg-nav:#fbfaf7;
  --bg-card:#ffffff;
  --bg-section:#eae6db;

  --teal:#801818;
  --teal-dim:#601010;
  --teal-glow:rgba(128,24,24,0.05);

  --text:#1c1b18;
  --text-muted:#706e64;

  --border:rgba(128,24,24,0.12);
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  transition:.25s;
}

/* NAV */

nav{
  position:sticky;
  top:0;
  z-index:100;

  height:56px;

  padding:0 24px;

  background:var(--bg-nav);
  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.nav-left{
  display:flex;
  align-items:center;
  gap:16px;
}

.back-btn{
  color:var(--text-muted);
  text-decoration:none;

  font-size:1.4rem;

  transition:.2s;
}

.back-btn:hover{
  color:var(--teal);
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;

  text-decoration:none;

  color:var(--teal);

  font-family:var(--serif);
  font-size:1.4rem;
  font-weight:600;
  font-style:italic;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:14px;
}

.theme-btn{
  background:none;
  border:none;

  width:32px;
  height:32px;

  border-radius:6px;

  color:var(--text-muted);

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:1rem;

  transition:
  color .2s,
  background .2s;
}

.theme-btn:hover{
  color:var(--teal);
  background:var(--teal-glow);
}

.nav-bell{
  width:32px;
  height:32px;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--text-muted);

  cursor:pointer;

  transition:.2s;
}

.nav-bell:hover{
  color:var(--teal);
}

.nav-bell .dot{
  position:absolute;

  top:6px;
  right:6px;

  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--teal);
}

.nav-avatar{
  width:32px;
  height:32px;

  border-radius:4px;

  background:var(--teal-glow);
  border:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:center;

  text-decoration:none;

  color:var(--teal);

  font-size:.85rem;
  font-weight:500;
}

/* MAIN */

main{
  max-width:720px;
  margin:auto;

  padding:40px 24px 80px;
}

.page-title{
  font-family:var(--serif);
  font-size:clamp(1.8rem,6vw,2.4rem);
  font-weight:600;

  margin-bottom:36px;
}

.section-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:18px;
}

.section-label{
  font-size:.7rem;
  letter-spacing:.18em;
  text-transform:uppercase;

  color:var(--teal);

  font-weight:500;
}

.view-buttons{
  display:flex;
  gap:4px;
}

.view-btn{
  width:34px;
  height:34px;

  border-radius:6px;

  border:1px solid var(--border);
  background:var(--bg-card);

  color:var(--text-muted);

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.2s;
}

.view-btn:hover{
  color:var(--teal);
}

.view-btn.active{
  color:var(--teal);
  border-color:var(--teal);
  background:var(--teal-glow);
}

/* LIST VIEW */

.board-list{
  display:flex;
  flex-direction:column;
}

.board-item{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:20px 8px;

  border-bottom:1px solid var(--border);

  position:relative;
}

.board-left{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.board-name{
  font-family:var(--serif);
  font-size:1.12rem;
  font-weight:600;
}

.board-meta{
  display:flex;
  align-items:center;
  gap:10px;

  font-size:.78rem;

  color:var(--text-muted);
}

.profile-tag{
  font-size:.62rem;
  letter-spacing:.08em;
  text-transform:uppercase;

  color:var(--teal);

  border:1px solid var(--border);

  border-radius:4px;

  padding:2px 6px;
}

.board-actions{
  position:relative;
}

.menu-btn{
  width:32px;
  height:32px;

  border:none;
  background:none;

  border-radius:6px;

  color:var(--text-muted);

  cursor:pointer;

  font-size:1.1rem;

  transition:.2s;
}

.menu-btn:hover{
  background:var(--teal-glow);
  color:var(--teal);
}

.dropdown{
  position:absolute;

  top:38px;
  right:0;

  width:180px;

  background:var(--bg-card);

  border:1px solid var(--border);
  border-radius:8px;

  overflow:hidden;

  display:none;

  z-index:50;
}

.dropdown.show{
  display:block;
}

.dropdown button{
  width:100%;

  border:none;
  background:none;

  padding:12px 14px;

  text-align:left;

  color:var(--text);

  cursor:pointer;

  font-size:.85rem;

  transition:.2s;
}

.dropdown button:hover{
  background:var(--teal-glow);
  color:var(--teal);
}

/* GRID */

.grid-view{
  display:none;

  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.grid-view.active{
  display:grid;
}

.board-card{
  background:var(--bg-card);

  border:1px solid var(--border);
  border-radius:12px;

  overflow:hidden;

  transition:.2s;
}

.board-card:hover{
  transform:translateY(-2px);
}

.board-cover{
  width:100%;
  aspect-ratio:2/3;

  position:relative;

  background:linear-gradient(145deg,#1f252b,#23202d);
}

body.light .board-cover{
  background:linear-gradient(145deg,#ede7db,#f7f2e8);
}

.card-info{
  padding:14px;
}

.card-title{
  font-family:var(--serif);
  font-size:1rem;
  font-weight:600;

  margin-bottom:4px;
}

.card-meta{
  font-size:.75rem;
  color:var(--text-muted);
}

/* CREATE */

.create-board{
  margin-top:34px;

  background:none;
  border:none;

  color:var(--teal);

  cursor:pointer;

  font-size:.95rem;

  transition:.2s;
}

.create-board:hover{
  opacity:.7;
}

.hidden{
  display:none;
}

@media(max-width:520px){

  main{
    padding:32px 20px 70px;
  }

  .grid-view{
    gap:12px;
  }

}

</style>
</head>

<body>

<nav>

  <div class="nav-left">

    <a href="quirki-home.html" class="back-btn">
      ‹
    </a>

    <a href="quirki-home.html" class="logo">

      <svg width="24" height="24" viewBox="0 0 26 26" fill="none">
        <path d="M13 2 C14.5 2 15.5 3 15 4.5 C16.5 3.5 18.5 4 19 5.5 C19.5 7 18.5 8.5 17 8.5 C18.5 9 19.5 10.5 19 12 C18.5 13.5 17 14 15.5 13.5 C16.5 15 16 17 14.5 17.5 C13 18 11.5 17 11.5 15.5 C10.5 17 9 17.5 7.5 16.5 C6 15.5 6 13.5 7.5 12.5 C6 12.5 4.5 11.5 4.5 10 C4.5 8.5 5.5 7.5 7 7.5 C5.5 7 4.5 5.5 5 4 C5.5 2.5 7.5 2 9 3 C8.5 1.5 10 0.5 11.5 1 C12.5 1.5 13 2 13 2Z" fill="currentColor"/>
      </svg>

      quirki

    </a>

  </div>

  <div class="nav-right">

    <button id="theme-btn" class="theme-btn" onclick="toggleTheme()">
      🌙
    </button>

    <a href="quirki-notif.html" class="nav-bell">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
        <path d="M10 2a6 6 0 0 0-6 6v2.5L2.5 13h15L16 10.5V8a6 6 0 0 0-6-6Z"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linejoin="round"/>

        <path d="M8 15a2 2 0 0 0 4 0"
        stroke="currentColor"
        stroke-width="1.4"/>
      </svg>

      <span class="dot"></span>
    </a>

    <a href="quirki-profile.html" class="nav-avatar">
      Z
    </a>

  </div>

</nav>

<main>

  <h1 class="page-title">Boards</h1>

  <div class="section-top">

    <div class="section-label">
      Your Boards
    </div>

    <div class="view-buttons">

      <button class="view-btn active" id="listBtn" onclick="setView('list')">

        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 4h12M2 8h12M2 12h12"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"/>
        </svg>

      </button>

      <button class="view-btn" id="gridBtn" onclick="setView('grid')">

        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1" width="5" height="5" rx="1"
          stroke="currentColor"
          stroke-width="1.4"/>

          <rect x="10" y="1" width="5" height="5" rx="1"
          stroke="currentColor"
          stroke-width="1.4"/>

          <rect x="1" y="10" width="5" height="5" rx="1"
          stroke="currentColor"
          stroke-width="1.4"/>

          <rect x="10" y="10" width="5" height="5" rx="1"
          stroke="currentColor"
          stroke-width="1.4"/>
        </svg>

      </button>

    </div>

  </div>

  <!-- LIST VIEW -->
  <div class="board-list" id="listView"></div>

  <!-- GRID VIEW -->
  <div class="grid-view" id="gridView"></div>

  <button class="create-board" onclick="createBoard()">
    + Create new board
  </button>

</main>

<script>

let currentView = 'list';

let boards = [
  {name:'Want to Read', books:14, profile:false},
  {name:'Read', books:37, profile:false},
  {name:'Favourites', books:8, profile:true},
  {name:'Butterfly', books:5, profile:true},
  {name:'Did Not Like', books:3, profile:false},
];

function renderBoards(){

  const list = document.getElementById('listView');
  const grid = document.getElementById('gridView');

  list.innerHTML = '';
  grid.innerHTML = '';

  boards.forEach((board,index)=>{

    // LIST
    const item = document.createElement('div');

    item.className = 'board-item';

    item.innerHTML = `
      <div class="board-left">

        <div class="board-name">
          ${board.name}
        </div>

        <div class="board-meta">

          <span>${board.books} books</span>

          ${board.profile
            ? `<span class="profile-tag">Added to profile</span>`
            : ''
          }

        </div>

      </div>

      <div class="board-actions">

        <button class="menu-btn"
        onclick="toggleMenu(event,${index})">
          ⋯
        </button>

        <div class="dropdown" id="menu-${index}">

          <button onclick="editBoard(${index})">
            Edit
          </button>

          <button onclick="toggleProfile(${index})">

            ${board.profile
              ? 'Remove from profile'
              : 'Add to profile'
            }

          </button>

          <button onclick="deleteBoard(${index})">
            Delete
          </button>

        </div>

      </div>
    `;

    list.appendChild(item);

    // GRID
    const card = document.createElement('div');

    card.className = 'board-card';

    card.innerHTML = `
  <div class="board-cover"></div>

  <div class="card-info">

    <div class="card-title">
      ${board.name}
    </div>

    <div class="card-meta">
      ${board.books} books
    </div>

  </div>
`;

    grid.appendChild(card);

  });

}

function toggleMenu(event,index){

  event.stopPropagation();

  document.querySelectorAll('.dropdown')
  .forEach(menu=>{
    menu.classList.remove('show');
  });

  document.getElementById(`menu-${index}`)
  .classList.toggle('show');

}

window.addEventListener('click',()=>{

  document.querySelectorAll('.dropdown')
  .forEach(menu=>{
    menu.classList.remove('show');
  });

});

function editBoard(index){

  const newName = prompt(
    'Edit board name:',
    boards[index].name
  );

  if(newName && newName.trim() !== ''){

    boards[index].name = newName.trim();

    renderBoards();
  }

}

function deleteBoard(index){

  const confirmed = confirm(
    `Delete "${boards[index].name}"?`
  );

  if(confirmed){

    boards.splice(index,1);

    renderBoards();

  }

}

function toggleProfile(index){

  boards[index].profile =
  !boards[index].profile;

  localStorage.setItem(
    'quirki-profile-boards',
    JSON.stringify(
      boards.filter(board => board.profile)
    )
  );

  renderBoards();

}

function createBoard(){

  const name = prompt('Board name');

  if(!name || name.trim()==='') return;

  boards.push({
    name:name.trim(),
    books:0,
    profile:false
  });

  renderBoards();

}

function setView(view){

  currentView = view;

  document.getElementById('listBtn')
  .classList.toggle('active', view==='list');

  document.getElementById('gridBtn')
  .classList.toggle('active', view==='grid');

  document.getElementById('listView')
  .style.display =
    view === 'list'
    ? 'flex'
    : 'none';

  document.getElementById('gridView')
  .classList.toggle('active', view==='grid');

}

function toggleTheme() {

  document.body.classList.toggle('light');

  const isLight =
    document.body.classList.contains('light');

  localStorage.setItem(
    'quirki-theme',
    isLight ? 'light' : 'dark'
  );

  const btn = document.getElementById('theme-btn');

  if (btn) {
    btn.textContent = isLight ? '🌑' : '🌙';
  }

}

(function(){

  const saved =
    localStorage.getItem('quirki-theme');

  if(saved === 'light'){

    document.body.classList.add('light');

    const btn =
      document.getElementById('theme-btn');

    if(btn){
      btn.textContent = '🌑';
    }

  }

})();

renderBoards();

</script>

</body>
</html>
