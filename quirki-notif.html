<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quirki — Notifications</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*,
*::before,
*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#1a1c1e;
  --bg-nav:#1c1e20;
  --bg-card:#212326;
  --teal:#00e5c4;
  --teal-glow:rgba(0,229,196,0.08);
  --text:#d8dde3;
  --text-muted:#6a7480;
  --border:rgba(255,255,255,0.06);
  --serif:'Playfair Display', Georgia, serif;
  --sans:'DM Sans', sans-serif;
}

body.light{
  --bg:#f5f1e8;
  --bg-nav:#f7f3eb;
  --bg-card:#fffdf8;
  --teal:#7a2e2e;
  --teal-glow:rgba(122,46,46,0.06);
  --text:#1c1b18;
  --text-muted:#6f665f;
  --border:rgba(122,46,46,0.10);
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  transition:.25s;
}

/* NAV */
nav{
  position:sticky;
  top:0;
  z-index:100;
  height:56px;
  padding:0 24px;
  background:var(--bg-nav);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.nav-left{
  display:flex;
  align-items:center;
  gap:16px;
}

.nav-back{
  color:var(--text-muted);
  display:flex;
  align-items:center;
  text-decoration:none;
  transition:.2s;
}

.nav-back:hover{
  color:var(--teal);
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  font-family:var(--serif);
  font-size:1.4rem;
  font-weight:600;
  font-style:italic;
  color:var(--teal);
}

.nav-right{
  display:flex;
  align-items:center;
  gap:14px;
}

.theme-btn{
  width:32px;
  height:32px;
  border:none;
  background:none;
  border-radius:6px;
  cursor:pointer;
  color:var(--text-muted);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
  font-size:1rem;
}

.theme-btn:hover{
  background:var(--teal-glow);
  color:var(--teal);
}

.nav-avatar{
  width:32px;
  height:32px;
  border-radius:4px;
  border:1px solid var(--border);
  background:var(--teal-glow);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--teal);
  text-decoration:none;
  font-size:.9rem;
  font-weight:500;
}

.nav-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* MAIN CONTENT */
main{
  max-width:620px;
  margin:auto;
  padding:40px 24px 80px;
}

.page-title{
  font-family:var(--serif);
  font-size:1.6rem;
  font-weight:600;
  margin-bottom:24px;
}

/* NOTIFICATION CONTAINER */
.notif-list{
  display:flex;
  flex-direction:column;
}

.notif-item{
  display:flex;
  gap:16px;
  padding:20px 8px;
  border-top:1px solid var(--border);
  align-items: flex-start;
}

/* Sparkle/Quirk Icon for System Notif */
.notif-icon-wrap{
  width:36px;
  height:36px;
  border-radius:6px;
  background:var(--teal-glow);
  color:var(--teal);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink: 0;
}

.notif-body{
  flex:1;
}

.notif-message{
  font-size:.95rem;
  line-height:1.5;
  margin-bottom:6px;
}

.notif-time{
  font-size:.78rem;
  color:var(--text-muted);
}
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="quirki-home.html" class="nav-back">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <a href="quirki-home.html" class="logo">
      <svg width="24" height="24" viewBox="0 0 26 26" fill="none">
        <path d="M13 2 C14.5 2 15.5 3 15 4.5 C16.5 3.5 18.5 4 19 5.5 C19.5 7 18.5 8.5 17 8.5 C18.5 9 19.5 10.5 19 12 C18.5 13.5 17 14 15.5 13.5 C16.5 15 16 17 14.5 17.5 C13 18 11.5 17 11.5 15.5 C10.5 17 9 17.5 7.5 16.5 C6 15.5 6 13.5 7.5 12.5 C6 12.5 4.5 11.5 4.5 10 C4.5 8.5 5.5 7.5 7 7.5 C5.5 7 4.5 5.5 5 4 C5.5 2.5 7.5 2 9 3 C8.5 1.5 10 0.5 11.5 1 C12.5 1.5 13 2 13 2Z" fill="currentColor"/>
      </svg>
      quirki
    </a>
  </div>

  <div class="nav-right">
    <button id="theme-btn" class="theme-btn" onclick="toggleTheme()">🌙</button>
    <a href="quirki-profile.html" class="nav-avatar" id="navAvatar">Z</a>
  </div>
</nav>

<main>
  <h1 class="page-title">Notifications</h1>

  <div class="notif-list">
    <div class="notif-item">
      <div class="notif-icon-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        </svg>
      </div>
      <div class="notif-body">
        <div class="notif-message">Welcome to Quirki! Your account has been created successfully.</div>
        <div class="notif-time">Just now</div>
      </div>
    </div>
  </div>
</main>

<script>
// Profile Avatar Dynamic Initialization
const username = localStorage.getItem('quirki-username') || 'Zee';
const firstLetter = username.charAt(0).toUpperCase();
const avatar = localStorage.getItem('quirki-avatar');

if(avatar){
  document.getElementById('navAvatar').innerHTML = `<img src="${avatar}">`;
} else {
  document.getElementById('navAvatar').textContent = firstLetter;
}

/* THEME SYSTEM CONTROLLER */
function toggleTheme(){
  document.body.classList.toggle('light');
  const isLight = document.body.classList.contains('light');
  localStorage.setItem('quirki-theme', isLight ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = isLight ? '🌑' : '🌙';
}
(function(){
  const saved = localStorage.getItem('quirki-theme');
  if(saved === 'light'){
    document.body.classList.add('light');
    document.getElementById('theme-btn').textContent = '🌑';
  }
})();
</script>
</body>
</html>
