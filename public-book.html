<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book | Quirki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        :root {
            --bg:#1a1c1e; --bg-nav:#1c1e20; --bg-card:#212326; --bg-section:#1e2022;
            --teal:#00e5c4; --teal-dim:#00b89e; --teal-glow:rgba(0,229,196,0.08);
            --teal-g2:rgba(0,229,196,0.15);
            --text:#d8dde3; --text-muted:#6a7480; --border:rgba(255,255,255,0.06);
            --serif:'Playfair Display',Georgia,serif;
            --sans:'DM Sans',sans-serif;
            --mono:'DM Mono',monospace;
            --reading:'Lora',Georgia,serif;
        }
        body.light {
            --bg:#f5f1e8; --bg-nav:#f7f3eb; --bg-card:#fffdf8; --bg-section:#e0e0db;
            --teal:#7a2e2e; --teal-dim:#5c2222; --teal-glow:rgba(122,46,46,0.06);
            --teal-g2:rgba(122,46,46,0.12);
            --text:#1c1b18; --text-muted:#6f665f; --border:rgba(122,46,46,0.10);
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; transition:background 0.25s,color 0.25s; }

        /* NAV */
        nav.top-nav { position:sticky; top:0; z-index:100; background:var(--bg-nav); border-bottom:1px solid var(--border); padding:0 24px; height:56px; display:flex; align-items:center; justify-content:space-between; }
        .nav-left { display:flex; align-items:center; gap:16px; }
        .logo { font-family:var(--serif); font-size:1.4rem; font-weight:600; color:var(--teal); font-style:italic; text-decoration:none; }
        .nav-back { color:var(--text-muted); display:flex; align-items:center; text-decoration:none; transition:color 0.2s; }
        .nav-back:hover { color:var(--teal); }
        .nav-right { display:flex; align-items:center; gap:14px; }
        .theme-btn { background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:1rem; padding:4px; transition:color 0.2s; }
        .theme-btn:hover { color:var(--teal); }
        .nav-avatar { width:32px; height:32px; border-radius:4px; background:var(--teal-glow); border:1.5px solid rgba(0,229,196,0.25); display:flex; align-items:center; justify-content:center; color:var(--teal); font-size:0.85rem; font-weight:500; text-decoration:none; }

        /* BOOK DETAIL SCENE */
        #detailScene { display:flex; flex-direction:column; align-items:center; padding-bottom:100px; }

        .hero { width:100%; max-width:720px; display:flex; flex-direction:column; align-items:center; padding:60px 20px 20px; }

        /* Cover */
        .cover-wrap { margin-bottom:32px; }
        .cover-box {
            width:200px; height:280px; border-radius:8px;
            background:var(--bg-card); border:1px solid var(--border);
            box-shadow:0 20px 50px rgba(0,0,0,0.5);
            background-size:cover; background-position:center;
            display:flex; align-items:center; justify-content:center; overflow:hidden;
        }
        .cover-generated { width:100%; height:100%; }

        /* Meta */
        .meta-block { width:100%; text-align:center; margin-bottom:24px; }
        .book-title { font-family:var(--serif); font-size:clamp(1.8rem,6vw,2.6rem); font-weight:400; line-height:1.2; color:var(--text); margin-bottom:6px; }
        .book-byline { font-size:0.95rem; color:var(--text-muted); }
        .book-byline span { color:var(--teal); }

        /* Metrics */
        .metrics { width:100%; display:grid; grid-template-columns:repeat(3,1fr); background:var(--bg-card); border:1px solid var(--border); border-radius:8px; margin-bottom:24px; }
        .metric { padding:14px; text-align:center; border-right:1px solid var(--border); }
        .metric:last-child { border-right:none; }
        .metric-label { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.18em; color:var(--text-muted); margin-bottom:4px; font-family:var(--mono); }
        .metric-val { font-family:var(--serif); font-size:1.4rem; font-weight:600; color:var(--text); }

        /* Start button */
        .start-btn { width:100%; background:var(--teal); border:none; color:var(--bg-nav); padding:18px; border-radius:4px; font-size:1rem; font-weight:600; cursor:pointer; transition:background 0.2s; margin-bottom:40px; }
        .start-btn:hover { background:var(--teal-dim); }

        /* Body */
        .book-body { width:100%; max-width:720px; padding:0 20px; }
        .synopsis { font-size:0.95rem; line-height:1.65; color:var(--text); margin-bottom:24px; }

        .tags-cloud { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:40px; }
        .tag { background:var(--teal-glow); color:var(--teal); border:1px solid var(--teal-g2); padding:4px 10px; border-radius:3px; font-family:var(--mono); font-size:0.7rem; }

        .toc-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .toc-label { font-size:0.7rem; color:var(--teal); text-transform:uppercase; letter-spacing:0.18em; font-family:var(--mono); }
        .toc-list { border-top:1px solid var(--border); margin-bottom:40px; }
        .toc-row { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid var(--border); cursor:pointer; transition:color 0.15s; }
        .toc-row:hover .toc-ch-title { color:var(--teal); }
        .toc-ch-num { font-family:var(--mono); font-size:0.7rem; color:var(--teal); min-width:28px; }
        .toc-ch-title { font-family:var(--serif); font-size:1.1rem; color:var(--text); transition:color 0.2s; }

        /* READER SCENE */
        #readerScene { display:none; min-height:100vh; flex-direction:column; align-items:center; padding-bottom:160px; }
        .reader-bar { width:100%; height:56px; display:flex; justify-content:space-between; align-items:center; padding:0 24px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:10; transition:background 0.2s; }
        .reader-btn { background:none; border:none; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; transition:color 0.2s; }
        .reader-btn:hover { color:var(--text); }
        .reader-book-title { font-family:var(--serif); font-size:0.9rem; font-style:italic; color:var(--text-muted); }
        .reader-col { width:100%; max-width:680px; padding:60px 20px 20px; }
        .chapter-headline { font-family:var(--serif); font-size:clamp(2rem,5vw,2.6rem); color:var(--text); font-weight:400; margin-bottom:8px; line-height:1.2; }
        .chapter-meta { font-size:0.8rem; color:var(--text-muted); margin-bottom:40px; border-bottom:1px solid var(--border); padding-bottom:24px; }
        .prose { font-family:var(--reading); font-size:17px; line-height:1.85; color:var(--text); transition:font-size 0.15s,font-family 0.15s; }
        .prose p { margin-bottom:24px; }

        .pagination { display:flex; justify-content:space-between; align-items:center; margin-top:80px; border-top:1px solid var(--border); padding-top:24px; }
        .page-btn { font-family:var(--sans); font-size:0.85rem; font-weight:500; color:var(--text-muted); background:none; border:none; cursor:pointer; padding:8px 4px; transition:color 0.2s; }
        .page-btn:hover { color:var(--teal); }
        .page-btn.hidden { visibility:hidden; pointer-events:none; }

        /* SETTINGS DRAWER */
        .settings-drawer { position:fixed; bottom:0; left:0; right:0; background:var(--bg-nav); border-top:1px solid var(--border); padding:24px 40px; z-index:100; display:none; flex-direction:column; gap:20px; box-shadow:0 -10px 40px rgba(0,0,0,0.5); }
        .drawer-row { display:flex; align-items:center; gap:24px; }
        .drawer-label { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.18em; color:var(--text-muted); width:100px; flex-shrink:0; font-family:var(--mono); }
        .size-cluster { display:flex; align-items:center; gap:12px; }
        .d-btn { background:var(--bg-card); border:1px solid var(--border); color:var(--text-muted); padding:6px 14px; border-radius:4px; cursor:pointer; font-size:0.85rem; height:34px; display:flex; align-items:center; transition:all 0.2s; }
        .d-btn:hover { border-color:var(--text); color:var(--text); }
        .size-label { font-family:var(--serif); font-weight:600; color:var(--text); font-size:1rem; min-width:40px; text-align:center; }
        .font-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; flex:1; }
        .f-btn { background:var(--bg-card); border:1px solid var(--border); color:var(--text-muted); padding:9px; border-radius:4px; cursor:pointer; font-size:0.88rem; text-align:center; transition:all 0.2s; }
        .f-btn:hover { border-color:var(--text); color:var(--text); }
        .f-btn.active { border-color:var(--teal); color:var(--teal); }
        .drawer-close { position:absolute; top:18px; right:22px; background:none; border:none; color:var(--text-muted); cursor:pointer; }
        .drawer-close:hover { color:var(--text); }

        /* LOADING / ERROR */
        .state-center { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:100px 24px; text-align:center; gap:12px; color:var(--text-muted); min-height:60vh; }
        .state-center h2 { font-family:var(--serif); font-size:1.5rem; font-style:italic; color:var(--text); }
        .state-center p { font-size:0.85rem; line-height:1.6; max-width:360px; }
        .state-center a { color:var(--teal); text-decoration:none; font-size:0.85rem; margin-top:8px; }
        .skeleton-hero { width:200px; height:280px; background:var(--bg-card); border-radius:8px; animation:pulse 1.4s ease infinite; margin-bottom:32px; }
        .skeleton-line { height:14px; background:var(--bg-card); border-radius:4px; animation:pulse 1.4s ease infinite; margin-bottom:10px; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    </style>
</head>
<body>

<nav class="top-nav">
    <div class="nav-left">
        <a href="quirki-search.html" class="nav-back">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a href="quirki-home.html" class="logo">quirki</a>
    </div>
    <div class="nav-right">
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
        <a href="quirki-profile.html" class="nav-avatar" id="navAvatar">?</a>
    </div>
</nav>

<!-- DETAIL SCENE -->
<div id="detailScene">
    <div class="state-center" id="loadingState">
        <div class="skeleton-hero"></div>
        <div class="skeleton-line" style="width:200px"></div>
        <div class="skeleton-line" style="width:140px;opacity:0.5"></div>
    </div>
</div>

<!-- READER SCENE -->
<div id="readerScene">
    <div class="reader-bar">
        <button class="reader-btn" onclick="closeReader()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <div class="reader-book-title" id="readerTitle"></div>
        <button class="reader-btn" onclick="openDrawer(true)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
    </div>
    <article class="reader-col">
        <h1 class="chapter-headline" id="chapterTitle"></h1>
        <div class="chapter-meta" id="chapterMeta"></div>
        <div class="prose" id="proseBody"></div>
        <footer class="pagination">
            <button class="page-btn" id="prevBtn" onclick="navigate(-1)">← Prev</button>
            <button class="page-btn" id="nextBtn" onclick="navigate(1)">Next →</button>
        </footer>
    </article>
    <div class="settings-drawer" id="settingsDrawer">
        <button class="drawer-close" onclick="openDrawer(false)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="drawer-row">
            <span class="drawer-label">Theme</span>
            <button class="d-btn" onclick="toggleTheme()">Toggle</button>
        </div>
        <div class="drawer-row">
            <span class="drawer-label">Font Size</span>
            <div class="size-cluster">
                <button class="d-btn" onclick="changeFontSize(-1)">A−</button>
                <div class="size-label" id="sizeLabel">17px</div>
                <button class="d-btn" onclick="changeFontSize(1)">A+</button>
            </div>
        </div>
        <div class="drawer-row">
            <span class="drawer-label">Font</span>
            <div class="font-grid">
                <button class="f-btn active" id="fLora"     onclick="setFont('Lora')">Lora</button>
                <button class="f-btn"        id="fPlayfair" onclick="setFont('Playfair')">Playfair</button>
                <button class="f-btn"        id="fSans"     onclick="setFont('Sans')">Sans</button>
            </div>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://niefhnktetrehrbesduz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_7cLg3pnVrkV4IjhMakr-DA_l4BtiUis';
const { createClient }  = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let book         = null;
let chapterIndex = 0;
let fontSize     = 17;

// ── Init ──────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
    if (localStorage.getItem('quirki-theme') === 'light') {
        document.body.classList.add('light');
        document.getElementById('themeBtn').textContent = '🌑';
    }

    const { data: { user } } = await sb.auth.getUser();
    if (user) document.getElementById('navAvatar').textContent = (user.email || 'U')[0].toUpperCase();

    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) { showError('No book specified.', 'Go back and select a book.'); return; }

    await loadBook(id);
});

// ── Load book from Supabase ───────────────────────────────
async function loadBook(id) {
    const { data, error } = await sb
        .from('books')
        .select('*')
        .eq('id', id)
        .single();

    if (error || !data) {
        showError('Book not found.', 'It may have been removed or the link is incorrect.');
        return;
    }

    book = {
        title:    data.title       || 'Untitled',
        author:   data.author_name || 'Unknown Author',
        synopsis: data.synopsis    || '',
        tags:     Array.isArray(data.tags) ? data.tags : [],
        chapters: Array.isArray(data.chapters) ? data.chapters.map((ch, i) => ({
            title:   ch.title   || `Chapter ${i + 1}`,
            content: ch.content || '<p>No content.</p>'
        })) : []
    };

    document.title = `${book.title} | Quirki`;
    renderDetail();
}

// ── Render detail page ────────────────────────────────────
function renderDetail() {
    const chCount = book.chapters.length;
    const wordCount = book.chapters.reduce((sum, ch) => {
        const txt = (ch.content || '').replace(/<[^>]*>/g,' ').trim();
        return sum + (txt ? txt.split(/\s+/).length : 0);
    }, 0);

    const tags = book.tags.slice(0, 6).map(t =>
        `<span class="tag">#${escapeHTML(t)}</span>`
    ).join('');

    const toc = book.chapters.map((ch, i) => `
        <div class="toc-row" onclick="openReader(${i})">
            <span class="toc-ch-num">${String(i+1).padStart(2,'0')}</span>
            <span class="toc-ch-title">${escapeHTML(ch.title)}</span>
        </div>
    `).join('');

    document.getElementById('detailScene').innerHTML = `
        <main class="hero">
            <div class="cover-wrap">
                <div class="cover-box" id="coverBox"></div>
            </div>
            <div class="meta-block">
                <h1 class="book-title">${escapeHTML(book.title)}</h1>
                <div class="book-byline">by <span>${escapeHTML(book.author)}</span></div>
            </div>
            <div class="metrics">
                <div class="metric"><div class="metric-label">Words</div><div class="metric-val">${wordCount > 999 ? (wordCount/1000).toFixed(1)+'k' : wordCount}</div></div>
<div class="metric"><div class="metric-label">Adds</div><div class="metric-val">0</div></div>
<div class="metric"><div class="metric-label">Views</div><div class="metric-val">0</div></div>
            </div>
            <button class="start-btn" onclick="openReader(0)">Start Reading</button>
            <div class="book-body">
                ${book.synopsis ? `<p class="synopsis">${escapeHTML(book.synopsis)}</p>` : ''}
                ${tags ? `<div class="tags-cloud">${tags}</div>` : ''}
                <div class="toc-head"><span class="toc-label">Table of Contents</span></div>
                <div class="toc-list">${toc}</div>
            </div>
        </main>
    `;

    // Set cover — generate one if not saved
    // (books saved from booksetup don't store cover in DB yet, so we generate)
    const coverBox = document.getElementById('coverBox');
    coverBox.style.backgroundImage = `url("${generateCover(book.title, book.author)}")`;
}

// ── Auto-generate cover ───────────────────────────────────
function generateCover(title, author) {
    const palettes = [
        ['#1a1a2e','#e94560'], ['#0d3b66','#fac748'],
        ['#1b4332','#95d5b2'], ['#3d0066','#c77dff'],
        ['#7b2d00','#ffb347'], ['#003049','#fcbf49'],
    ];
    const [bg, accent] = palettes[Math.abs(hashStr(title)) % palettes.length];

    function hashStr(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
        return h;
    }
    function wrapText(text, max) {
        const words = text.split(' ');
        const lines = []; let cur = '';
        words.forEach(w => {
            if ((cur+' '+w).trim().length > max) { if(cur) lines.push(cur.trim()); cur = w; }
            else cur = (cur+' '+w).trim();
        });
        if (cur) lines.push(cur.trim());
        return lines;
    }

    const titleLines = wrapText(title || 'Untitled', 14);
    const titleY = 150;
    const lineH = 42;
    const titleSVG = titleLines.map((line, i) =>
        `<text x="150" y="${titleY + i * lineH}" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="#fff">${line}</text>`
    ).join('');
    const authorY = titleY + titleLines.length * lineH + 30;

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
        <rect width="300" height="420" fill="${bg}"/>
        <rect x="0" y="0" width="7" height="420" fill="${accent}"/>
        <rect y="380" width="300" height="40" fill="${accent}" opacity="0.12"/>
        <line x1="22" y1="55" x2="278" y2="55" stroke="${accent}" stroke-width="1" opacity="0.35"/>
        <line x1="22" y1="358" x2="278" y2="358" stroke="${accent}" stroke-width="1" opacity="0.35"/>
        ${titleSVG}
        <text x="150" y="${authorY}" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="${accent}" opacity="0.85">${author || ''}</text>
    </svg>`;

    return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

// ── Reader ────────────────────────────────────────────────
function openReader(idx) {
    chapterIndex = idx;
    document.getElementById('detailScene').style.display  = 'none';
    document.getElementById('readerScene').style.display  = 'flex';
    window.scrollTo(0, 0);
    mountChapter();
}

function closeReader() {
    document.getElementById('readerScene').style.display  = 'none';
    document.getElementById('detailScene').style.display  = 'flex';
    openDrawer(false);
    window.scrollTo(0, 0);
}

function mountChapter() {
    const ch = book.chapters[chapterIndex];
    if (!ch) return;
    document.getElementById('readerTitle').textContent  = book.title;
    document.getElementById('chapterTitle').textContent = ch.title;
    document.getElementById('chapterMeta').textContent  = `Chapter ${chapterIndex + 1} of ${book.chapters.length}`;
    document.getElementById('proseBody').innerHTML      = ch.content;
    document.getElementById('proseBody').style.fontSize = `${fontSize}px`;
    document.getElementById('prevBtn').className = 'page-btn' + (chapterIndex === 0 ? ' hidden' : '');
    document.getElementById('nextBtn').className = 'page-btn' + (chapterIndex === book.chapters.length - 1 ? ' hidden' : '');
}

function navigate(dir) {
    const next = chapterIndex + dir;
    if (next >= 0 && next < book.chapters.length) {
        chapterIndex = next;
        window.scrollTo({ top:0, behavior:'smooth' });
        mountChapter();
    }
}

// ── Settings ──────────────────────────────────────────────
function openDrawer(state) { document.getElementById('settingsDrawer').style.display = state ? 'flex' : 'none'; }

function changeFontSize(dir) {
    fontSize = Math.min(34, Math.max(12, fontSize + dir));
    document.getElementById('sizeLabel').textContent = `${fontSize}px`;
    document.getElementById('proseBody').style.fontSize = `${fontSize}px`;
}

function setFont(key) {
    const prose = document.getElementById('proseBody');
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    if (key === 'Lora')     { prose.style.fontFamily = 'var(--reading)'; document.getElementById('fLora').classList.add('active'); }
    if (key === 'Playfair') { prose.style.fontFamily = 'var(--serif)';   document.getElementById('fPlayfair').classList.add('active'); }
    if (key === 'Sans')     { prose.style.fontFamily = 'var(--sans)';    document.getElementById('fSans').classList.add('active'); }
}

// ── Error state ───────────────────────────────────────────
function showError(title, msg) {
    document.getElementById('detailScene').innerHTML = `
        <div class="state-center">
            <h2>${title}</h2>
            <p>${msg}</p>
            <a href="quirki-search.html">← Back to Discover</a>
        </div>`;
}

// ── Theme ─────────────────────────────────────────────────
function toggleTheme() {
    document.body.classList.toggle('light');
    const isLight = document.body.classList.contains('light');
    localStorage.setItem('quirki-theme', isLight ? 'light' : 'dark');
    document.getElementById('themeBtn').textContent = isLight ? '🌑' : '🌙';
}

function escapeHTML(str) {
    return String(str).replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]||t));
}
</script>
